name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk phosphor-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phosphor-launcher
          path: phosphor-launcher.apk

      # Keeps one rolling "latest" release so the APK can be downloaded on a phone.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest phosphor-launcher.apk \
            --title "Phosphor Launcher (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download phosphor-launcher.apk on your Android phone and open it to install." \
            --target "$GITHUB_SHA" --prerelease
